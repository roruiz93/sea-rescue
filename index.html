<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0,
             user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable"       content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color"                  content="#0a2040" />

  <title>Sea Rescue</title>

  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #0a2040;
      touch-action: none;         /* prevent default touch scrolling */
      -webkit-user-select: none;
      user-select: none;
    }

    /* ── Canvas centering ── */
    #game-container {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }

    canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
      /* Crisp pixel rendering for retina displays */
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
    }

    /* ── Loading fallback ── */
    #splash {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #0a2040;
      color: #f9a825;
      font-family: Arial, sans-serif;
      font-size: 22px;
      font-weight: bold;
      z-index: 9999;
      transition: opacity 0.5s;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }
    #splash p { margin-top: 12px; font-size: 14px; color: #90caf9; }
  </style>
</head>
<body>
  <!-- Initial loading splash (hidden once Phaser boots) -->
  <div id="splash">
    🌊 SEA RESCUE
    <p>Cargando el océano...</p>
  </div>

  <div id="game-container"></div>

  <script type="module" src="/src/main.js"></script>
  <script>
    // Hide splash once the canvas is inserted
    const observer = new MutationObserver(() => {
      if (document.querySelector('canvas')) {
        document.getElementById('splash').classList.add('hidden');
        observer.disconnect();
      }
    });
    observer.observe(document.getElementById('game-container'), { childList: true });
  </script>
</body>
</html>
